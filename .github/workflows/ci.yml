name: CI

# 私有仓库的 macOS 构建有额度限制：只改文档不触发；同一分支有新推送时取消旧的运行
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**.md", ".github/ISSUE_TEMPLATE/**", "LICENSE"]
  pull_request:
    paths-ignore: ["docs/**", "**.md", ".github/ISSUE_TEMPLATE/**", "LICENSE"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: 工具链版本
        run: swift --version
      - name: 单元测试与覆盖率
        run: scripts/coverage.sh
      - name: 构建 macOS 应用（ad-hoc 签名）
        run: scripts/build-macos.sh
