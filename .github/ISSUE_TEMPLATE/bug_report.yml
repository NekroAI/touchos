name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! For security problems, please use **Security → Report a vulnerability** instead of a public issue.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: TouchOS version
      description: Menu bar icon → Settings → About
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: macOS version and chip
      placeholder: macOS 15.3, Apple M2
    validations:
      required: true
  - type: input
    id: trackpad
    attributes:
      label: Trackpad
      placeholder: Built-in, Magic Trackpad (USB-C), both…
    validations:
      required: true
  - type: textarea
    id: more
    attributes:
      label: Anything else?
      description: Other gesture tools running (BetterTouchTool, BetterAndBetter…), screenshots, steps to reproduce.
